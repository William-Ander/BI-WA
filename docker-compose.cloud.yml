# BI WA — Deploy cloud Docker Compose
# Uso: docker compose -f docker-compose.cloud.yml up -d
# Para configurar: copie .env.cloud para .env e ajuste as variáveis

version: "3.9"

volumes:
  biwa_data:
    driver: local
  mysql_data:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

networks:
  biwa_net:
    driver: bridge

services:
  # --- MySQL (opcional: substitua por serviço externo se preferir) ---
  mysql:
    image: mysql:8.0
    container_name: biwa-mysql
    restart: unless-stopped
    networks:
      - biwa_net
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TroqueSenhaRoot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biwa_cloud}
      MYSQL_USER: ${MYSQL_USER:-biwa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-TroqueSenhaBiwa}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- BI WA (online/viewer mode) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biwa-app
    restart: unless-stopped
    networks:
      - biwa_net
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - biwa_data:/app/data
    env_file:
      - .env
    environment:
      APP_MODE: online
      PORT: "3000"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-biwa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-TroqueSenhaBiwa}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biwa_cloud}
      BIWA_REALTIME_EVENT_TABLE: ${BIWA_REALTIME_EVENT_TABLE:-}
      DEFAULT_REFRESH_SECONDS: ${DEFAULT_REFRESH_SECONDS:-15}
      SERVER_PUSH_INTERVAL_SECONDS: ${SERVER_PUSH_INTERVAL_SECONDS:-15}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      BIWA_AUTH_SECRET: ${BIWA_AUTH_SECRET:-}
      VIEWER_USER: ${VIEWER_USER:-viewer}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}
      BIWA_ALLOW_OPEN_ONLINE: ${BIWA_ALLOW_OPEN_ONLINE:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Nginx (reverse proxy + SSL) ---
  nginx:
    image: nginx:1.27-alpine
    container_name: biwa-nginx
    restart: unless-stopped
    networks:
      - biwa_net
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 2

  # --- Certbot (SSL auto-renewal) ---
  certbot:
    image: certbot/certbot:v2.x
    container_name: biwa-certbot
    networks:
      - biwa_net
    depends_on:
      - nginx
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;"
